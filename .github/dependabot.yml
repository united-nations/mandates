version: 2
updates:
  - package-ecosystem: npm
    directory: /website
    target-branch: dev
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      next:
        patterns: [next, '@next/*', eslint-config-next]
        update-types: [patch, minor]
      react:
        patterns: [react, react-dom, '@types/react', '@types/react-dom']
        update-types: [patch, minor]
      routine-web:
        patterns: ['*']
        update-types: [patch, minor]
  - package-ecosystem: uv
    directory: /data-processing
    target-branch: dev
    open-pull-requests-limit: 3
    schedule:
      interval: weekly
    groups:
      routine-python:
        patterns: ['*']
        update-types: [patch, minor]
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    open-pull-requests-limit: 2
    schedule:
      interval: weekly
    groups:
      routine-actions:
        patterns: ['*']
        update-types: [patch, minor]
  - package-ecosystem: docker
    directory: /website
    target-branch: dev
    open-pull-requests-limit: 1
    schedule:
      interval: weekly
    # Keep Node 22 patches and image digests current; review runtime majors
    # separately after the supported-LTS migration has been tested.
    ignore:
      - dependency-name: node
        update-types: ['version-update:semver-major']
