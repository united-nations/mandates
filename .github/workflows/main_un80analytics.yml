# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - un80analytics

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/security-checks.yml

  build:
    needs: checks
    runs-on: 'ubuntu-latest'

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

    - name: Log in to registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        registry: https://undashboarddevregistry.azurecr.io/
        username: ${{ secrets.AzureAppService_ContainerUsername_5b8d2f85ffcb4b208ff0f52d22680741 }}
        password: ${{ secrets.AzureAppService_ContainerPassword_f401a129f533477589c2118e5170169a }}

    - name: Build and push container image to registry
      uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3
      with:
        context: .
        push: true
        tags: undashboarddevregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_5b8d2f85ffcb4b208ff0f52d22680741 }}/imagedashboard:${{ github.sha }}
        file: ./website/Dockerfile
        # Inlined into the client bundle at build time so the Sentry feedback
        # widget mounts. Public value; add it as a repo secret (or var).
        build-args: |
          NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2
      with:
        app-name: 'un80analytics'
        slot-name: 'production'
        publish-profile: ${{ secrets.AzureAppService_PublishProfile_03b456bc23bc4d0cab3848d5ca77df25 }}
        images: 'undashboarddevregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_5b8d2f85ffcb4b208ff0f52d22680741 }}/imagedashboard:${{ github.sha }}'