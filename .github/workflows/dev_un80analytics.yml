# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy container app to Azure Web App - UN80-Dboard2-Dev

on:
  push:
    branches:
      - dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/security-checks.yml

  build:
    needs: checks
    runs-on: "ubuntu-latest"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2

      - name: Log in to registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2
        with:
          registry: https://undashboarddevregistry.azurecr.io/
          username: ${{ secrets.AzureAppService_ContainerUsername_d1ee42b2ff344239bfca6eb86ed892e4 }}
          password: ${{ secrets.AzureAppService_ContainerPassword_3cfd9429423846518ab5755d92e21862 }}

      - name: Build and push container image to registry
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3
        with:
          context: .
          push: true
          tags: undashboarddevregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_d1ee42b2ff344239bfca6eb86ed892e4 }}/lowercaseimage:${{ github.sha }}
          file: ./website/Dockerfile
          # Inlined into the client bundle at build time so the Sentry feedback
          # widget mounts. Public value; add it as a repo secret (or var).
          build-args: |
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: "production"
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@5cfb776471c748b351e1ebf5770e208a54ace016 # v2
        with:
          app-name: "UN80-Dboard2-Dev"
          slot-name: "production"
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_8a0893d0c68143288fec4026da39f25c }}
          images: "undashboarddevregistry.azurecr.io/${{ secrets.AzureAppService_ContainerUsername_d1ee42b2ff344239bfca6eb86ed892e4 }}/lowercaseimage:${{ github.sha }}"
