name: Security and quality checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - run: corepack enable
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      # Dev-tool advisories remain visible in the full audit report; the release
      # gate rejects high/critical advisories in production dependency chains.
      - run: pnpm audit --prod --audit-level high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan Git history with checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir=$(mktemp -d)
          curl --fail --location --silent --show-error --max-time 60 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scanner_dir/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $scanner_dir/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$scanner_dir/gitleaks.tar.gz" -C "$scanner_dir" gitleaks
          "$scanner_dir/gitleaks" git --redact --no-banner --log-opts=--all .

  pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: data-processing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m pip install uv==0.12.5
      - run: uv sync --frozen --python 3.13
      - name: Run self-contained pipeline tests
        # series_metrics.py delegates to a separately maintained repository.
        # Its integration tests require that repository and are not standalone.
        run: |
          uv run python -m unittest discover -s tests -p 'test_database.py'
          uv run python -m unittest discover -s tests -p 'test_report_mandate_links*.py'
      - name: Audit locked Python dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/pipeline-requirements.txt"
          uvx --python 3.13 pip-audit --no-deps --disable-pip --requirement "$RUNNER_TEMP/pipeline-requirements.txt"
