[project]
name = "data-processing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "joblib>=1.6.0",
    "natsort>=8.4.0",
    "openai>=2.36.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.2",
    "psycopg2-binary>=2.9.13",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "rich>=15.0.0",
    "tqdm>=4.67.3",
]

[tool.uv]
# package = false: uv manages this project's dependencies but does not build or
# install the project itself. Observed 30 Jul 2026: with package = true, every
# `uv add` and `uv sync` failed at the setuptools build step with "Multiple
# top-level packages discovered in a flat-layout: ['ppb_processing',
# 'report_mandate_links']" -- once a second top-level directory existed,
# auto-discovery could no longer decide what the package set was, and
# package = true turns that ambiguity into an install-time error. Nothing
# imports this project as an installed package: ppb_processing, utils and
# report_mandate_links all resolve from the working directory when commands
# are run from data-processing/, so there is nothing to install.
package = false
